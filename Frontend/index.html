<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập & Đăng ký - QLchitieu</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <!-- Background decorative glows -->
  <div class="bg-blob-1"></div>
  <div class="bg-blob-2"></div>

  <!-- Top status indicator -->
  <div class="top-status-bar" id="backend-status-bar" title="Trạng thái kết nối đến máy chủ Backend">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Đang kiểm tra kết nối...</span>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Brand & Header -->
      <div class="brand-header">
        <div class="brand-icon-wrapper">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <h1 class="brand-title">SMART<span>MONEY</span></h1>
        <p class="brand-desc">Hệ thống Quản lý Chi tiêu Cá nhân Thông minh</p>
      </div>

      <!-- Navigation Tabs -->
      <div class="auth-tabs">
        <button type="button" class="tab-btn active" id="tab-login">Đăng nhập</button>
        <button type="button" class="tab-btn" id="tab-register">Đăng ký mới</button>
      </div>

      <!-- Dynamic Alert Banner -->
      <div class="alert-banner" id="alert-banner">
        <div class="alert-icon">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke-width="2"/>
            <line x1="12" y1="8" x2="12" y2="12" stroke-width="2"/>
            <line x1="12" y1="16" x2="12.01" y2="16" stroke-width="2"/>
          </svg>
        </div>
        <div id="alert-message"></div>
      </div>

      <!-- FORM ĐĂNG NHẬP -->
      <form class="auth-form active" id="form-login" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Địa chỉ Email</label>
          <div class="input-container">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
              </svg>
            </span>
            <input 
              type="email" 
              id="login-email" 
              class="input-field" 
              placeholder="tenban@email.com" 
              autocomplete="email"
              required 
            />
          </div>
          <div class="field-error-msg" id="login-email-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Mật khẩu</label>
          <div class="input-container">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-width="2"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
            </span>
            <input 
              type="password" 
              id="login-password" 
              class="input-field" 
              placeholder="••••••••" 
              autocomplete="current-password"
              required 
            />
            <button type="button" class="toggle-password-btn" data-target="login-password" title="Hiện/ẩn mật khẩu">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <div class="field-error-msg" id="login-pass-error"></div>
        </div>

        <div class="form-options-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" checked />
            <span>Ghi nhớ tài khoản</span>
          </label>
          <a href="#" class="forgot-link" onclick="alert('Vui lòng liên hệ Admin để khôi phục mật khẩu.'); return false;">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="submit-btn" id="btn-login">
          <span class="spinner"></span>
          <span class="btn-text">Đăng nhập ngay</span>
        </button>
      </form>

      <!-- FORM ĐĂNG KÝ -->
      <form class="auth-form" id="form-register" novalidate>
        <div class="form-group">
          <label class="form-label" for="reg-name">Họ và tên</label>
          <div class="input-container">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </span>
            <input 
              type="text" 
              id="reg-name" 
              class="input-field" 
              placeholder="Nguyễn Văn A" 
              autocomplete="name"
            />
          </div>
          <div class="field-error-msg" id="reg-name-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Địa chỉ Email</label>
          <div class="input-container">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
              </svg>
            </span>
            <input 
              type="email" 
              id="reg-email" 
              class="input-field" 
              placeholder="tenban@email.com" 
              autocomplete="email"
              required 
            />
          </div>
          <div class="field-error-msg" id="reg-email-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Mật khẩu (ít nhất 6 ký tự)</label>
          <div class="input-container">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-width="2"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
            </span>
            <input 
              type="password" 
              id="reg-password" 
              class="input-field" 
              placeholder="••••••••" 
              autocomplete="new-password"
              required 
            />
            <button type="button" class="toggle-password-btn" data-target="reg-password" title="Hiện/ẩn mật khẩu">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <div class="field-error-msg" id="reg-pass-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password-confirm">Xác nhận lại mật khẩu</label>
          <div class="input-container">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-width="2"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
            </span>
            <input 
              type="password" 
              id="reg-password-confirm" 
              class="input-field" 
              placeholder="••••••••" 
              autocomplete="new-password"
              required 
            />
          </div>
          <div class="field-error-msg" id="reg-confirm-error"></div>
        </div>

        <button type="submit" class="submit-btn" id="btn-register">
          <span class="spinner"></span>
          <span class="btn-text">Tạo tài khoản mới</span>
        </button>
      </form>

      <!-- Quick Fill Demo -->
      <div class="demo-box">
        <button type="button" class="demo-btn" id="btn-fill-demo">
          Điền nhanh tài khoản mẫu
        </button>
      </div>

      <div class="auth-footer">
        QLchitieu v1.0 • Bảo mật chuẩn JWT Authentication
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
