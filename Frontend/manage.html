<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Quản lý · SmartMoney</title>
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body data-page="manage">
    <aside class="shell" id="shell"></aside>
    <main class="content" id="main">
      <header class="page-heading">
        <div>
          <h1 id="section-title">Quản lý</h1>
          <p id="section-description"></p>
        </div>
        <button
          class="button primary"
          type="button"
          id="new-item"
          hidden
        ></button>
      </header>
      <section class="panel">
        <div id="manage-filters" class="filter-panel"></div>
        <div id="manage-content" aria-live="polite">
          <p class="empty">Đang tải…</p>
        </div>
      </section>
      <dialog id="manage-dialog" aria-labelledby="manage-dialog-title">
        <form id="manage-form">
          <header class="dialog-heading">
            <h2 id="manage-dialog-title"></h2>
            <button
              id="close-manage"
              type="button"
              class="icon-button"
              aria-label="Đóng"
            >
              ×
            </button>
          </header>
          <div id="manage-fields" class="form-grid"></div>
          <p id="manage-error" class="inline-error" role="alert" hidden></p>
          <footer class="dialog-actions">
            <button class="button primary" id="manage-save">Lưu</button>
          </footer>
        </form>
      </dialog>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/manage.js"></script>
  </body>
</html>
