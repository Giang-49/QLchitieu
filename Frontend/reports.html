<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Báo cáo · SmartMoney</title>
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body data-page="reports">
    <aside class="shell" id="shell"></aside>
    <main class="content" id="main">
      <header class="page-heading">
        <div>
          <h1>Báo cáo thu chi</h1>
          <p id="report-range">Chọn kỳ cần xem</p>
        </div>
        <button
          class="button secondary"
          type="button"
          id="export-report"
          disabled
        >
          ↓ Xuất Excel
        </button>
      </header>
      <section class="panel filter-panel" aria-label="Chọn kỳ báo cáo">
        <label
          >Kỳ báo cáo
          <select id="report-period">
            <option value="month">Tháng</option>
            <option value="week">Tuần</option>
            <option value="year">Năm</option>
          </select>
        </label>
        <label
          >Ngày trong kỳ
          <input type="date" id="report-date" min="2000-01-01" max="9998-12-31"
        /></label>
        <div class="period-buttons">
          <button
            class="button secondary"
            id="prev-period"
            type="button"
            aria-label="Kỳ trước"
          >
            ←
          </button>
          <button
            class="button secondary"
            id="next-period"
            type="button"
            aria-label="Kỳ sau"
          >
            →
          </button>
        </div>
      </section>
      <p id="report-status" role="status" class="inline-error" hidden></p>
      <section class="metrics three" aria-label="Tóm tắt kỳ báo cáo">
        <article class="metric">
          <span>Tổng thu</span
          ><strong id="report-income" class="income">—</strong>
        </article>
        <article class="metric">
          <span>Tổng chi</span><strong id="report-expense">—</strong>
        </article>
        <article class="metric">
          <span>Chênh lệch</span><strong id="report-net">—</strong>
        </article>
      </section>
      <div class="report-grid">
        <section class="panel">
          <div class="panel-heading">
            <div>
              <h2>Cơ cấu chi tiêu</h2>
              <p>Phân bổ theo danh mục trong kỳ</p>
            </div>
          </div>
          <div id="donut"></div>
        </section>
        <section class="panel">
          <div class="panel-heading">
            <div>
              <h2>Thu và chi theo tháng</h2>
              <p id="comparison-range">So sánh thu và chi</p>
            </div>
          </div>
          <div id="bars" class="chart-host"></div>
        </section>
      </div>
      <section class="panel">
        <div class="panel-heading">
          <div>
            <h2>Xu hướng chênh lệch</h2>
            <p>Số dương khi thu nhiều hơn chi, số âm khi chi nhiều hơn thu</p>
          </div>
        </div>
        <div id="trend" class="chart-host"></div>
        <details id="chart-data" hidden>
          <summary>Xem bảng số liệu theo tháng</summary>
          <div id="report-table" class="table-scroll"></div>
        </details>
      </section>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/reports.js"></script>
  </body>
</html>
