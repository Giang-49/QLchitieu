<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Giao dịch · SmartMoney</title>
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body data-page="transactions">
    <aside class="shell" id="shell"></aside>
    <main class="content" id="main">
      <header class="page-heading">
        <div>
          <h1>Giao dịch</h1>
          <p>Tra cứu và cập nhật các khoản thu, chi.</p>
        </div>
        <button id="new-transaction" class="button primary" type="button">
          ＋ Giao dịch mới
        </button>
      </header>
      <section class="panel">
        <div class="panel-heading">
          <h2>Lịch sử giao dịch</h2>
          <button
            class="button secondary"
            id="export-transaction"
            type="button"
          >
            ↓ Xuất Excel
          </button>
        </div>
        <form id="filters" class="filter-panel">
          <label class="search-field"
            >Tìm theo ghi chú<input
              id="filter-search"
              type="search"
              placeholder="Nhập ghi chú"
          /></label>
          <label
            >Loại<select id="filter-type">
              <option value="">Tất cả</option>
              <option value="expense">Chi</option>
              <option value="income">Thu</option>
            </select></label
          >
          <label
            >Danh mục<select id="filter-category">
              <option value="">Tất cả</option>
            </select></label
          >
          <label
            >Ví<select id="filter-wallet">
              <option value="">Tất cả</option>
            </select></label
          >
          <label>Tháng<input id="filter-month" type="month" /></label>
          <button id="clear-filters" type="button" class="text-button">
            Xóa bộ lọc
          </button>
        </form>
        <div id="transaction-list" class="table-scroll" aria-live="polite">
          <p class="empty">Đang tải…</p>
        </div>
        <div class="pagination" id="pagination"></div>
      </section>
      <dialog id="transaction-editor" aria-labelledby="editor-title">
        <form id="transaction-form">
          <header class="dialog-heading">
            <h2 id="editor-title">Giao dịch mới</h2>
            <button
              class="icon-button"
              id="close-editor"
              type="button"
              aria-label="Đóng"
            >
              ×
            </button>
          </header>
          <div class="form-grid">
            <label
              >Loại<select name="type">
                <option value="expense">Chi tiêu</option>
                <option value="income">Thu nhập</option>
              </select></label
            >
            <label
              >Số tiền (₫)<input
                name="amount"
                type="number"
                inputmode="decimal"
                min="0.01"
                max="9999999999999.99"
                step="0.01"
                required
            /></label>
            <label>Danh mục<select name="category_id" required></select></label>
            <label>Ví<select name="wallet_id" required></select></label>
            <label
              >Ngày giao dịch<input
                name="transaction_date"
                type="date"
                required
            /></label>
            <label>
              Ảnh hóa đơn
              <input
                type="file"
                name="receipt"
                accept="image/png,image/jpeg,image/webp"
              />
              <small>PNG, JPEG hoặc WebP. Tối đa 5 MB.</small>
            </label>
            <label class="full"
              >Hoặc nhập liên kết ảnh<input
                name="image_url"
                type="url"
                placeholder="https://…"
                maxlength="500"
            /></label>
            <label class="full checkbox-row" id="remove-receipt-option" hidden>
              <input type="checkbox" name="remove_receipt" /> Gỡ ảnh hóa đơn
              hiện tại
            </label>
            <label class="full"
              >Ghi chú<textarea name="note" rows="2" maxlength="200"></textarea>
            </label>
          </div>
          <p id="editor-error" class="inline-error" role="alert" hidden></p>
          <footer class="dialog-actions">
            <button class="button primary" id="save-transaction">
              Lưu giao dịch
            </button>
          </footer>
        </form>
      </dialog>
      <dialog id="delete-dialog" aria-labelledby="delete-title">
        <form method="dialog">
          <h2 id="delete-title">Xóa giao dịch?</h2>
          <p>Số dư ví sẽ được điều chỉnh theo giao dịch bị xóa.</p>
          <div class="dialog-actions">
            <button class="button secondary" value="cancel">Hủy</button
            ><button class="button danger" value="delete">Xóa giao dịch</button>
          </div>
        </form>
      </dialog>
      <dialog id="receipt-dialog" aria-labelledby="receipt-title">
        <header class="dialog-heading">
          <h2 id="receipt-title">Ảnh hóa đơn</h2>
          <button
            class="icon-button"
            id="close-receipt"
            type="button"
            aria-label="Đóng"
          >
            ×
          </button>
        </header>
        <div id="receipt-content" aria-live="polite"></div>
      </dialog>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/transactions.js"></script>
  </body>
</html>
